<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Defender - Space Shooter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;700&display=swap');
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #05050a;
            color: #fff;
            touch-action: none;
            overflow: hidden;
            user-select: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .neon-text-blue {
            text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff, 0 0 30px #00f0ff;
        }

        .neon-text-pink {
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f, 0 0 30px #ff007f;
        }

        .neon-box-blue {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.2);
            border: 1px solid #00f0ff;
        }

        .neon-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 2px solid #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            transition: all 0.2s ease;
        }

        .neon-btn:hover, .neon-btn:active {
            background: rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
            transform: translateY(-2px);
        }

        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-center items-center relative bg-slate-950 overflow-hidden">

    <!-- Game Canvas Wrapper -->
    <div id="game-container" class="relative w-full h-full max-w-5xl max-h-[900px] flex justify-center items-center p-0 md:p-4">
        
        <!-- HUD Overlay -->
        <div id="hud" class="absolute top-4 left-4 right-4 z-10 flex justify-between items-center pointer-events-none hidden px-4 py-2 rounded-xl bg-slate-900/60 backdrop-blur-md border border-cyan-500/30">
            <div class="flex items-center gap-6">
                <div>
                    <div class="text-xs text-cyan-400 font-bold uppercase tracking-wider">Score</div>
                    <div id="score-el" class="text-2xl font-orbitron font-extrabold text-white">0</div>
                </div>
                <div>
                    <div class="text-xs text-cyan-400 font-bold uppercase tracking-wider">Level</div>
                    <div id="level-el" class="text-2xl font-orbitron font-extrabold text-cyan-300">1</div>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <!-- Health Bar -->
                <div class="w-32 md:w-48">
                    <div class="flex justify-between text-xs text-cyan-400 mb-1 font-bold">
                        <span>SCHILD</span>
                        <span id="health-text">100%</span>
                    </div>
                    <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden border border-cyan-500/30">
                        <div id="health-bar" class="bg-gradient-to-r from-cyan-500 to-blue-500 h-full w-full transition-all duration-200"></div>
                    </div>
                </div>
                <button id="pause-btn" class="pointer-events-auto p-2 text-cyan-400 hover:text-white transition">
                    <i class="fas fa-pause text-xl"></i>
                </button>
            </div>
        </div>

        <!-- Canvas Target -->
        <canvas id="gameCanvas" class="w-full h-full rounded-none md:rounded-2xl neon-box-blue bg-black/90"></canvas>

        <!-- Start Screen Overlay -->
        <div id="start-screen" class="absolute inset-0 z-20 flex flex-col justify-center items-center bg-slate-950/85 backdrop-blur-md p-6 text-center">
            <h1 class="text-5xl md:text-7xl font-orbitron font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-fuchsia-500 mb-2 neon-text-blue tracking-wider">
                NEON DEFENDER
            </h1>
            <p class="text-cyan-300 text-lg md:text-xl mb-8 max-w-md font-medium">
                Verdedig de melkweg tegen golven van neon-indringers!
            </p>

            <div class="bg-slate-900/80 border border-cyan-500/30 rounded-xl p-4 mb-8 max-w-sm w-full text-left text-sm text-slate-300">
                <div class="text-cyan-400 font-bold mb-2 text-center uppercase tracking-wider">Besturing</div>
                <div class="flex justify-between items-center my-1">
                    <span><i class="fas fa-arrows-alt text-cyan-400 mr-2"></i>Bewegen</span>
                    <span class="bg-slate-800 px-2 py-1 rounded text-xs">Pijltjes / WASD</span>
                </div>
                <div class="flex justify-between items-center my-1">
                    <span><i class="fas fa-crosshairs text-cyan-400 mr-2"></i>Schieten</span>
                    <span class="bg-slate-800 px-2 py-1 rounded text-xs">Spatiebalk / Touch</span>
                </div>
                <div class="flex justify-between items-center my-1">
                    <span><i class="fas fa-mobile-alt text-cyan-400 mr-2"></i>Mobiel</span>
                    <span class="bg-slate-800 px-2 py-1 rounded text-xs">Virtuele Buttons</span>
                </div>
            </div>

            <button id="start-btn" class="neon-btn font-orbitron text-xl font-bold px-10 py-4 rounded-xl text-cyan-300 tracking-widest uppercase">
                <i class="fas fa-play mr-3"></i> Start Game
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="absolute inset-0 z-20 flex flex-col justify-center items-center bg-slate-950/90 backdrop-blur-md p-6 text-center hidden">
            <h2 class="text-5xl md:text-6xl font-orbitron font-black text-red-500 mb-2 neon-text-pink">GAME OVER</h2>
            <p class="text-slate-400 mb-6">Je schip is vernietigd!</p>

            <div class="bg-slate-900/80 border border-slate-700 rounded-xl p-6 mb-8 max-w-xs w-full">
                <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Eindscore</div>
                <div id="final-score" class="text-4xl font-orbitron font-extrabold text-cyan-400 mb-4">0</div>
                <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Hoogste Score</div>
                <div id="high-score" class="text-2xl font-orbitron font-bold text-yellow-400">0</div>
            </div>

            <button id="restart-btn" class="neon-btn font-orbitron text-lg font-bold px-8 py-3 rounded-xl text-cyan-300 tracking-widest uppercase">
                <i class="fas fa-redo mr-2"></i> Opnieuw Proberen
            </button>
        </div>

        <!-- Mobile Controls Overlay -->
        <div id="mobile-controls" class="absolute bottom-4 left-4 right-4 z-10 flex justify-between items-end pointer-events-none md:hidden hidden">
            <!-- D-Pad -->
            <div class="grid grid-cols-3 gap-2 w-36 h-36 pointer-events-auto">
                <div></div>
                <button id="btn-up" class="bg-slate-800/60 border border-cyan-500/40 rounded-lg active:bg-cyan-500/50 flex items-center justify-center text-cyan-400 text-xl"><i class="fas fa-chevron-up"></i></button>
                <div></div>
                <button id="btn-left" class="bg-slate-800/60 border border-cyan-500/40 rounded-lg active:bg-cyan-500/50 flex items-center justify-center text-cyan-400 text-xl"><i class="fas fa-chevron-left"></i></button>
                <div></div>
                <button id="btn-right" class="bg-slate-800/60 border border-cyan-500/40 rounded-lg active:bg-cyan-500/50 flex items-center justify-center text-cyan-400 text-xl"><i class="fas fa-chevron-right"></i></button>
                <div></div>
                <button id="btn-down" class="bg-slate-800/60 border border-cyan-500/40 rounded-lg active:bg-cyan-500/50 flex items-center justify-center text-cyan-400 text-xl"><i class="fas fa-chevron-down"></i></button>
                <div></div>
            </div>

            <!-- Fire Button -->
            <button id="btn-fire" class="w-20 h-20 bg-rose-600/40 border-2 border-rose-500 rounded-full active:bg-rose-500/80 pointer-events-auto flex items-center justify-center text-white text-2xl shadow-lg shadow-rose-500/30">
                <i class="fas fa-crosshairs"></i>
            </button>
        </div>
    </div>

    <script>
        // --- Web Audio API Sound System ---
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playShoot() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playExplosion() {
                if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 0.3;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, this.ctx.currentTime);
                filter.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.3);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start();
                noise.stop(this.ctx.currentTime + 0.3);
            }

            playPowerup() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.25);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }

            playHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }
        }

        const soundFX = new SoundFX();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI elements
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('hud');
        const scoreEl = document.getElementById('score-el');
        const levelEl = document.getElementById('level-el');
        const healthBar = document.getElementById('health-bar');
        const healthText = document.getElementById('health-text');
        const finalScoreEl = document.getElementById('final-score');
        const highScoreEl = document.getElementById('high-score');
        const mobileControls = document.getElementById('mobile-controls');

        // State management
        let gameState = 'START'; // START, PLAYING, GAMEOVER, PAUSED
        let score = 0;
        let level = 1;
        let highScore = localStorage.getItem('nd_highscore') || 0;
        let lastTime = 0;
        let enemySpawnTimer = 0;
        let powerupSpawnTimer = 0;

        // Resize Canvas
        function resizeCanvas() {
            const container = document.getElementById('game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Key Listeners
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space' && gameState === 'PLAYING') {
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // Touch Listeners
        const touchState = { up: false, down: false, left: false, right: false, fire: false };
        function bindTouchButton(id, stateKey) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); touchState[stateKey] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); touchState[stateKey] = false; });
        }
        bindTouchButton('btn-up', 'up');
        bindTouchButton('btn-down', 'down');
        bindTouchButton('btn-left', 'left');
        bindTouchButton('btn-right', 'right');
        bindTouchButton('btn-fire', 'fire');

        // Player Class
        class Player {
            constructor() {
                this.width = 40;
                this.height = 40;
                this.x = canvas.width / 2 - this.width / 2;
                this.y = canvas.height - 100;
                this.speed = 7;
                this.health = 100;
                this.maxHealth = 100;
                this.tripleShotTimer = 0;
                this.shieldTimer = 0;
                this.shootCooldown = 0;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

                // Shield Effect
                if (this.shieldTimer > 0) {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.width, 0, Math.PI * 2);
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 3;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#00ffff';
                    ctx.stroke();
                }

                // Thruster Flame Particle Emission
                particles.push(new Particle(
                    this.x + this.width / 2 + (Math.random() * 10 - 5),
                    this.y + this.height,
                    Math.random() * 2 - 1,
                    Math.random() * 4 + 2,
                    Math.random() * 3 + 2,
                    '#00f0ff'
                ));

                // Player Ship (Neon Triangle Vector)
                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2);
                ctx.lineTo(this.width / 2, this.height / 2);
                ctx.lineTo(0, this.height / 4);
                ctx.lineTo(-this.width / 2, this.height / 2);
                ctx.closePath();

                ctx.fillStyle = '#050515';
                ctx.fill();
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00f0ff';
                ctx.stroke();

                ctx.restore();
            }

            update() {
                // Movement
                if ((keys['ArrowLeft'] || keys['KeyA'] || touchState.left) && this.x > 0) {
                    this.x -= this.speed;
                }
                if ((keys['ArrowRight'] || keys['KeyD'] || touchState.right) && this.x < canvas.width - this.width) {
                    this.x += this.speed;
                }
                if ((keys['ArrowUp'] || keys['KeyW'] || touchState.up) && this.y > 0) {
                    this.y -= this.speed;
                }
                if ((keys['ArrowDown'] || keys['KeyS'] || touchState.down) && this.y < canvas.height - this.height) {
                    this.y += this.speed;
                }

                // Shooting
                if (this.shootCooldown > 0) this.shootCooldown--;
                if ((keys['Space'] || touchState.fire) && this.shootCooldown === 0) {
                    this.shoot();
                    this.shootCooldown = 10;
                }

                // Powerup Timers
                if (this.tripleShotTimer > 0) this.tripleShotTimer--;
                if (this.shieldTimer > 0) this.shieldTimer--;
            }

            shoot() {
                soundFX.playShoot();
                if (this.tripleShotTimer > 0) {
                    bullets.push(new Bullet(this.x + this.width / 2, this.y, 0, -10));
                    bullets.push(new Bullet(this.x + this.width / 2, this.y, -3, -9));
                    bullets.push(new Bullet(this.x + this.width / 2, this.y, 3, -9));
                } else {
                    bullets.push(new Bullet(this.x + this.width / 2, this.y, 0, -10));
                }
            }
        }

        // Bullet Class
        class Bullet {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = 3;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ff007f';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ff007f';
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
            }
        }

        // Enemy Class
        class Enemy {
            constructor(type = 'STANDARD') {
                this.type = type;
                this.width = type === 'FAST' ? 30 : 45;
                this.height = type === 'FAST' ? 30 : 45;
                this.x = Math.random() * (canvas.width - this.width);
                this.y = -this.height;
                this.speed = type === 'FAST' ? 5 + level * 0.5 : 2 + level * 0.3;
                this.hp = type === 'FAST' ? 1 : 2;
                this.color = type === 'FAST' ? '#ffaa00' : '#ff0055';
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

                ctx.beginPath();
                if (this.type === 'FAST') {
                    ctx.moveTo(0, this.height / 2);
                    ctx.lineTo(-this.width / 2, -this.height / 2);
                    ctx.lineTo(this.width / 2, -this.height / 2);
                } else {
                    ctx.moveTo(0, this.height / 2);
                    ctx.lineTo(-this.width / 2, 0);
                    ctx.lineTo(-this.width / 4, -this.height / 2);
                    ctx.lineTo(this.width / 4, -this.height / 2);
                    ctx.lineTo(this.width / 2, 0);
                }
                ctx.closePath();

                ctx.fillStyle = '#15050a';
                ctx.fill();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.stroke();

                ctx.restore();
            }

            update() {
                this.y += this.speed;
            }
        }

        // PowerUp Class
        class PowerUp {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'TRIPLE', 'SHIELD', 'HEALTH'
                this.radius = 15;
                this.speed = 2;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                let color = '#00ffcc';
                if (this.type === 'TRIPLE') color = '#ff00ff';
                if (this.type === 'SHIELD') color = '#00ffff';
                if (this.type === 'HEALTH') color = '#00ff66';

                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = color;
                ctx.stroke();

                ctx.fillStyle = color;
                ctx.font = '10px Orbitron';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.type[0], this.x, this.y);
                ctx.restore();
            }

            update() {
                this.y += this.speed;
            }
        }

        // Particle Class
        class Particle {
            constructor(x, y, vx, vy, size, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.size = size;
                this.color = color;
                this.life = 1.0;
                this.decay = Math.random() * 0.03 + 0.015;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
        }

        // Starfield Background
        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speed = Math.random() * 2 + 0.5;
            }

            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }

            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.y = 0;
                    this.x = Math.random() * canvas.width;
                }
            }
        }

        let player = new Player();
        let bullets = [];
        let enemies = [];
        let powerups = [];
        let particles = [];
        let stars = Array.from({ length: 70 }, () => new Star());

        function createExplosion(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push(new Particle(
                    x, y,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    Math.random() * 3 + 1,
                    color
                ));
            }
        }

        function updateHUD() {
            scoreEl.innerText = score;
            levelEl.innerText = level;
            const healthPct = Math.max(0, Math.round((player.health / player.maxHealth) * 100));
            healthBar.style.width = healthPct + '%';
            healthText.innerText = healthPct + '%';
        }

        function gameLoop(timestamp) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update & Draw Background Stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            if (gameState === 'PLAYING') {
                // Player Logic
                player.update();
                player.draw();

                // Spawning Enemies
                enemySpawnTimer++;
                if (enemySpawnTimer > Math.max(20, 70 - level * 5)) {
                    const type = Math.random() > 0.7 ? 'FAST' : 'STANDARD';
                    enemies.push(new Enemy(type));
                    enemySpawnTimer = 0;
                }

                // Spawning Powerups
                powerupSpawnTimer++;
                if (powerupSpawnTimer > 500) {
                    const types = ['TRIPLE', 'SHIELD', 'HEALTH'];
                    const chosen = types[Math.floor(Math.random() * types.length)];
                    powerups.push(new PowerUp(Math.random() * (canvas.width - 30) + 15, -20, chosen));
                    powerupSpawnTimer = 0;
                }

                // Bullets Loop
                bullets.forEach((b, bIdx) => {
                    b.update();
                    b.draw();

                    // Remove offscreen
                    if (b.y < -10) bullets.splice(bIdx, 1);
                });

                // Enemies Loop & Collisions
                enemies.forEach((e, eIdx) => {
                    e.update();
                    e.draw();

                    // Check Collision with Bullets
                    bullets.forEach((b, bIdx) => {
                        if (
                            b.x > e.x && b.x < e.x + e.width &&
                            b.y > e.y && b.y < e.y + e.height
                        ) {
                            e.hp--;
                            bullets.splice(bIdx, 1);
                            createExplosion(b.x, b.y, '#ff007f', 6);

                            if (e.hp <= 0) {
                                soundFX.playExplosion();
                                createExplosion(e.x + e.width / 2, e.y + e.height / 2, e.color, 20);
                                enemies.splice(eIdx, 1);
                                score += e.type === 'FAST' ? 150 : 100;

                                // Level Progression
                                if (score >= level * 1000) {
                                    level++;
                                }
                                updateHUD();
                            }
                        }
                    });

                    // Collision with Player
                    if (
                        player.x < e.x + e.width &&
                        player.x + player.width > e.x &&
                        player.y < e.y + e.height &&
                        player.y + player.height > e.y
                    ) {
                        createExplosion(e.x + e.width / 2, e.y + e.height / 2, e.color, 15);
                        enemies.splice(eIdx, 1);

                        if (player.shieldTimer <= 0) {
                            player.health -= 25;
                            soundFX.playHit();
                            updateHUD();

                            if (player.health <= 0) {
                                triggerGameOver();
                            }
                        } else {
                            soundFX.playHit();
                        }
                    }

                    // Enemy passes bottom
                    if (e.y > canvas.height) {
                        enemies.splice(eIdx, 1);
                    }
                });

                // Powerups Loop
                powerups.forEach((p, pIdx) => {
                    p.update();
                    p.draw();

                    // Collision with Player
                    const dist = Math.hypot(player.x + player.width / 2 - p.x, player.y + player.height / 2 - p.y);
                    if (dist < player.width / 2 + p.radius) {
                        soundFX.playPowerup();
                        if (p.type === 'TRIPLE') player.tripleShotTimer = 300;
                        if (p.type === 'SHIELD') player.shieldTimer = 300;
                        if (p.type === 'HEALTH') player.health = Math.min(player.maxHealth, player.health + 30);

                        updateHUD();
                        createExplosion(p.x, p.y, '#00ffff', 12);
                        powerups.splice(pIdx, 1);
                    }

                    if (p.y > canvas.height + 20) powerups.splice(pIdx, 1);
                });

                // Particles Loop
                particles.forEach((p, pIdx) => {
                    p.update();
                    p.draw();
                    if (p.life <= 0) particles.splice(pIdx, 1);
                });
            }

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            soundFX.init();
            score = 0;
            level = 1;
            player = new Player();
            bullets = [];
            enemies = [];
            powerups = [];
            particles = [];

            updateHUD();

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            mobileControls.classList.remove('hidden');

            gameState = 'PLAYING';
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            soundFX.playExplosion();

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('nd_highscore', highScore);
            }

            finalScoreEl.innerText = score;
            highScoreEl.innerText = highScore;

            hud.classList.add('hidden');
            mobileControls.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        document.getElementById('pause-btn').addEventListener('click', () => {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
            }
        });

        // Start Loop Initialization
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
